name: LICITA Tender Workspace CI
on:
  push:
    branches: ['relaunch/licitaciones-matriz-2026']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run regression tests
        working-directory: frontend
        run: npm test
      - name: Test local tender engine
        working-directory: frontend
        run: node --test tests/tender-core.test.mjs
      - name: Check production build
        working-directory: frontend
        run: npm run build
      - name: Verify PDF worker is emitted
        working-directory: frontend
        run: |
          test -s dist/index.html
          find dist/assets -name '*pdf.worker*.mjs' -type f | grep .
