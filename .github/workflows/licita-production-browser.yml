name: LICITA Production Browser E2E
on:
  push:
    branches: [master]
    paths:
      - 'frontend/tests/production-browser-e2e.mjs'
      - 'frontend/tests/official-pcap-e2e.mjs'
      - '.github/workflows/licita-production-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify live product with synthetic PDF (desktop and mobile)
        working-directory: frontend
        env:
          SITE_URL: https://www.licita-ai.com
        run: node tests/production-browser-e2e.mjs
      - name: Download a published 52-page official PCAP model from Junta de Andalucía
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 60 'https://www.juntadeandalucia.es/export/drupaljda/PCAP%20NO%20SARA%20v6_0.pdf' -o /tmp/licita-pcap-junta.pdf
          test "$(head -c 5 /tmp/licita-pcap-junta.pdf)" = '%PDF-'
          echo "Downloaded official PCAP model: $(wc -c < /tmp/licita-pcap-junta.pdf) bytes"
      - name: Verify full real public PCAP PDF in production browser
        working-directory: frontend
        env:
          PCAP_PATH: /tmp/licita-pcap-junta.pdf
        run: node tests/official-pcap-e2e.mjs
