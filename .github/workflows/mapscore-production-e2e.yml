name: MAPSCORE Production E2E

on:
  push:
    branches: [master]
    paths:
      - 'frontend/api/mapscore-*.js'
      - 'frontend/api/_mapscore-report.js'
      - 'frontend/public/mapscore/**'
      - 'frontend/tests/**'
      - '.github/workflows/mapscore-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark E2E pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'MAPSCORE Production E2E', description: 'Verificando producción'});
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        working-directory: frontend
        run: npm ci && npm test
      - name: Production flow
        id: prod
        continue-on-error: true
        env:
          BASE_URL: https://www.licita-ai.com
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(path,body){const r=await fetch(process.env.BASE_URL+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}};if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,500)}`);return j}
          async function main(){
            let html='';
            for(let i=0;i<20;i++){try{const r=await fetch(process.env.BASE_URL+'/mapscore/');html=await r.text();if(r.ok&&html.includes('Nosotros localizamos el negocio'))break}catch{}await sleep(3000)}
            assert(html.includes('Ciudad o código postal'),'UI no acepta ciudad/código postal');
            assert(html.includes('Dirección (opcional)'),'Dirección no opcional en UI');
            assert(!html.includes('URL de Google Maps</label><input'),'UI exige URL Google Maps');
            const access=await json('/api/mapscore-private-access',{code:'NEXUS7K'});assert(access.ok&&access.token,'Sin acceso de prueba');
            const found=await json('/api/mapscore-business',{business:'Deoga Desarrollo y Ejecucion de Obra SL',city:'Granada',address:''});
            assert(found.source==='google','Búsqueda no usa Google Places');assert(found.places?.length,'DEOGA no encontrada');
            const p=found.places.find(x=>/deoga/i.test(x.name))||found.places[0];
            assert(/granada/i.test(p.address||''),'Dirección DEOGA no es Granada');assert(/deoga\.es/i.test(p.website||''),'Web DEOGA no detectada');assert(p.phone,'Teléfono no detectado');assert(Number.isFinite(p.rating)&&Number.isFinite(p.reviews),'Valoración/reseñas no reales');assert(p.has_photos===true,'Fotos DEOGA no confirmadas');
            const report=await json('/api/mapscore-analysis',{email:'delivered+mapscore-e2e@resend.dev',business_data:p,notes:'mejorar captación local',access_token:access.token});
            assert(report.mapscore>=0&&report.mapscore<=100,'MAPSCORE inválido');assert(report.resumen_ejecutivo?.trim(),'Resumen vacío');assert(report.hallazgos?.length>=6,'Hallazgos incompletos');assert(report.prioridades?.length>=5,'Prioridades incompletas');assert(Object.values(report.plan30||{}).every(x=>Array.isArray(x)&&x.length>=2),'Plan30 incompleto');assert(report.checklist?.length>=8,'Checklist incompleto');assert(report.kpis?.length>=5,'KPIs incompletos');assert(report.resultado_objetivo_90_dias?.trim(),'Objetivo90 vacío');
            const full=JSON.stringify(report).toLowerCase();assert(!/no hay fotos|sin fotos|carece de fotos|no tiene fotos/.test(full),'Informe afirma que no hay fotos');assert(!/no tiene web|carece de web|sin web/.test(full),'Informe afirma que no hay web');assert(/sí; google devolvió/i.test(String(report.datos_verificados?.fotos||'')),'Fotos verificadas no reflejadas');assert(/deoga\.es/i.test(String(report.datos_verificados?.web||'')),'Web verificada no reflejada');
            const recipient=`delivered+mapscore-${Date.now()}@resend.dev`;const delivery=await json('/api/mapscore-deliver',{email:recipient,business:p.name,result:report,access_token:access.token});assert(delivery.accepted===true&&delivery.id,'Resend no aceptó');assert(delivery.ok===true&&delivery.delivered===true,`Entrega no confirmada (${delivery.state||'sin estado'})`);assert(['delivered','opened','clicked'].includes(delivery.state),'Estado email no confirmado');
            console.log(JSON.stringify({business:p.name,rating:p.rating,reviews:p.reviews,website:p.website,photos:p.photo_sample_count,mapscore:report.mapscore,email_state:delivery.state},null,2));
          }
          main().catch(e=>{fs.writeFileSync('e2e-error.txt',String(e.message||e).slice(0,120));console.error(e);process.exit(1)});
          NODE
      - name: Publish E2E result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const ok='${{ steps.prod.outcome }}' === 'success';
            let description=ok?'Flujo de producción verificado':'Falló producción';
            if(!ok&&fs.existsSync('e2e-error.txt')) description=fs.readFileSync('e2e-error.txt','utf8').slice(0,135);
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: ok ? 'success' : 'failure', context: 'MAPSCORE Production E2E', description});
      - name: Fail job if production failed
        if: steps.prod.outcome == 'failure'
        run: exit 1
