<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPSCORE AI</title><meta name="description" content="Auditoría automática de presencia local y Google Maps con IA."><style>body{font-family:system-ui;max-width:760px;margin:0 auto;padding:36px;color:#111}h1{font-size:48px}.card{border:1px solid #ddd;border-radius:14px;padding:24px;margin:24px 0}input,textarea{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box}button,.btn{display:inline-block;background:#111;color:#fff;padding:14px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none}.muted{color:#666}.score{font-size:44px;font-weight:800}.hide{display:none}</style></head><body><h1>MAPSCORE AI</h1><p>Auditoría automática de presencia local para detectar qué puedes mejorar en Google Maps.</p><div id="pay" class="card"><h2>Auditoría MAPSCORE</h2><p><b>9,90 €</b> · pago único</p><a class="btn" href="https://buy.stripe.com/cNi7sL6tfaLA3QC46KeUU01">Comprar auditoría</a></div><div id="audit" class="card hide"><form id="f"><label>Email</label><input name="email" type="email" required><label>Nombre del negocio</label><input name="business" required><label>Ciudad</label><input name="city" required><label>Categoría</label><input name="category"><label>URL de Google Maps</label><input name="maps_url" required><label>Web</label><input name="website"><label>Información adicional</label><textarea name="notes" rows="4"></textarea><button>Generar mi auditoría</button></form></div><div id="out"></div><script>const paid=new URLSearchParams(location.search).get('paid')==='1';const pay=document.getElementById('pay'),audit=document.getElementById('audit'),f=document.getElementById('f'),out=document.getElementById('out');if(paid){pay.classList.add('hide');audit.classList.remove('hide')}fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'pageview',pagina:'mapscore',session_id:crypto.randomUUID?.()||Date.now().toString(),metadata:{paid}})}).catch(()=>{});f.onsubmit=async(e)=>{e.preventDefault();if(!paid)return;out.innerHTML='<p>Analizando…</p>';const data=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/mapscore-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');audit.classList.add('hide');fetch('/api/mapscore-deliver',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:data.email,business:data.business,result:j})}).catch(()=>{});fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'mapscore_generado',pagina:'mapscore',metadata:{business:data.business,mapscore:j.mapscore}})}).catch(()=>{});out.innerHTML=`<div class="card"><div class="score">${j.mapscore}/100</div><p>${j.resumen}</p><h3>Prioridades</h3><ol>${(j.acciones||[]).map(x=>`<li>${x}</li>`).join('')}</ol><p>También hemos enviado el resultado a <b>${data.email}</b>.</p><p><a class="btn" href="https://buy.stripe.com/bJe8wP9Fr3j81Iu1YCeUU02">Auditoría avanzada · 19,90 €</a></p><p class="muted">MAPSCORE es una puntuación interna; no es una métrica oficial de Google.</p></div>`}catch(err){out.innerHTML='<p>No se pudo generar el análisis. Inténtalo de nuevo.</p>'}};</script></body></html>
