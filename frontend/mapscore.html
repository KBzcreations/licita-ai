<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPSCORE AI</title><style>body{font-family:system-ui;max-width:760px;margin:0 auto;padding:36px;color:#111}h1{font-size:48px}.card{border:1px solid #ddd;border-radius:14px;padding:24px;margin:24px 0}input,textarea{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box}button{background:#111;color:#fff;padding:14px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.muted{color:#666}.score{font-size:44px;font-weight:800}</style></head><body><h1>MAPSCORE AI</h1><p>Auditoría automática de presencia local para detectar qué puedes mejorar en Google Maps.</p><div class="card"><form id="f"><label>Nombre del negocio</label><input name="business" required><label>Ciudad</label><input name="city" required><label>Categoría</label><input name="category"><label>URL de Google Maps</label><input name="maps_url" required><label>Web</label><input name="website"><label>Información adicional</label><textarea name="notes" rows="4"></textarea><button>Analizar negocio</button></form></div><div id="out"></div><script>const f=document.getElementById('f'),out=document.getElementById('out');f.onsubmit=async(e)=>{e.preventDefault();out.innerHTML='<p>Analizando…</p>';const data=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/mapscore-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');out.innerHTML=`<div class="card"><div class="score">${j.mapscore}/100</div><p>${j.resumen}</p><h3>Prioridades</h3><ol>${(j.acciones||[]).map(x=>`<li>${x}</li>`).join('')}</ol><p class="muted">MAPSCORE es una puntuación interna; no es una métrica oficial de Google.</p></div>`}catch(err){out.innerHTML='<p>No se pudo generar el análisis.</p>'}};</script></body></html>
