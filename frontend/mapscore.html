<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPSCORE AI</title><style>body{font-family:system-ui;max-width:760px;margin:0 auto;padding:36px;color:#111}h1{font-size:48px}.card{border:1px solid #ddd;border-radius:14px;padding:24px;margin:24px 0}input,textarea{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box}.btn,button{display:inline-block;background:#111;color:#fff;padding:14px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none}.muted{color:#666}.score{font-size:44px;font-weight:800}</style></head><body><h1>MAPSCORE AI</h1><p>Auditoría automática de presencia local para detectar oportunidades de mejora en Google Maps.</p><div id="gate"></div><div id="out"></div><script>const paid=new URLSearchParams(location.search).get('paid')==='1',gate=document.getElementById('gate'),out=document.getElementById('out');if(!paid){gate.innerHTML='<div class="card"><h2>Auditoría MAPSCORE</h2><p>Diagnóstico automático + prioridades + plan de acción.</p><h2>9,90 €</h2><a class="btn" href="https://buy.stripe.com/cNi7sL6tfaLA3QC46KeUU01">Comprar auditoría</a></div>'}else{gate.innerHTML=`<div class="card"><h2>Pago recibido</h2><form id="f"><label>Nombre del negocio</label><input name="business" required><label>Ciudad</label><input name="city" required><label>Categoría</label><input name="category"><label>URL de Google Maps</label><input name="maps_url" required><label>Web</label><input name="website"><label>Información adicional</label><textarea name="notes" rows="4"></textarea><button>Generar mi auditoría</button></form></div>`;document.getElementById('f').onsubmit=async e=>{e.preventDefault();out.innerHTML='<p>Analizando…</p>';const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/mapscore-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw 0;out.innerHTML=`<div class="card"><div class="score">${j.mapscore}/100</div><p>${j.resumen||''}</p><h3>Prioridades</h3><ol>${(j.acciones||[]).map(x=>`<li>${x}</li>`).join('')}</ol><p><a class="btn" href="https://buy.stripe.com/bJe8wP9Fr3j81Iu1YCeUU02">Auditoría avanzada — 19,90 €</a></p><p class="muted">MAPSCORE es una puntuación interna; no es una métrica oficial de Google.</p></div>`}catch(_){out.innerHTML='<p>No se pudo generar el análisis. Inténtalo de nuevo.</p>'}}}</script></body></html>
